<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Webpage</title>
    <style>
        /* ตั้งค่าความสูงหน้าจอพื้นฐาน */
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* รูปแบบหลักสำหรับสร้าง Parallax Effect */
        .parallax {
            height: 100vh;                  /* ให้เต็มความสูงหน้าจอพอดี */
            background-attachment: fixed;   /* ล็อคภาพพื้นหลังไว้กับที่ (Parallax) */
            background-position: center;    /* จัดภาพให้อยู่ตรงกลาง */
            background-repeat: no-repeat;  /* ไม่ให้ภาพซ้ำ */
            background-size: cover;         /* ขยายภาพให้เต็มพื้นที่ */
            
            /* จัดข้อความให้อยู่ตรงกลางหน้าจอ */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* รูปที่ 1 (ภาพด้านบนสุด) */
        .img1 {
            background-image: url('https://picsum.photos/id/1018/1920/1080');
        }

        /* รูปที่ 2 (ภาพด้านล่างสุด) */
        .img2 {
            background-image: url('https://picsum.photos/id/1015/1920/1080');
        }

        /* กล่องข้อความตรงกลางภาพ */
        .message {
            background-color: rgba(0, 0, 0, 0.6); /* กล่องสีดำโปร่งแสง */
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 8px;
            text-align: center;
        }

        /* บล็อกสีดำตรงกลางหน้า */
        .black-block {
            background-color: black;
            color: white;
            padding: 80px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1. ภาพแรก + ข้อความตรงกลาง -->
    <div class="parallax img1">
        <div class="message">
            <h1>Welcome to My Webpage</h1>
        </div>
    </div>

    <!-- 2. บล็อกสีดำ + ข้อความ -->
    <div class="black-block">
        <h2>Section Title</h2>
        <p>This is a black block section with custom message.</p>
    </div>

    <!-- 3. ภาพที่สอง + ข้อความตรงกลาง -->
    <div class="parallax img2">
        <div class="message">
            <h1>Thank You for Visiting</h1>
        </div>
    </div>

</body>
</html>
