<!DOCTYPE html>
<html>
<head>
  <style>
    table {
      border-collapse: collapse;
    }
    td {
      padding: 100px 200px;
      border: 1px solid black;
      color: black;
    }
    text {
      color: white;
      text-align: center;
      font-style: bold;
      font-size: 60px;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td style="background-color: red;">
        <text>Black</text>
      </td>
      <td style="background-color: black;">
        <text>Red</text>
      </td>
    </tr>
  </table>
</body>
</html>
